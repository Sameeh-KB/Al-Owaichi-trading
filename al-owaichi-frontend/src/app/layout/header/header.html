<header class="header" [class.scrolled]="scrolled()">
  <div class="container">
    <div class="header-inner">

      <!-- Logo -->
      <a class="logo" [routerLink]="['/']">
        <div class="logo-mark">
          <svg viewBox="0 0 32 32" fill="none" aria-hidden="true">
            <rect width="32" height="32" fill="var(--cta)"/>
            <text x="16" y="22" text-anchor="middle"
                  font-family="IBM Plex Mono,monospace"
                  font-size="11" font-weight="700" fill="#fff"
                  letter-spacing="0.5">AOT</text>
          </svg>
        </div>
        <div class="logo-text">
          <span class="logo-name">Al Owaichi Trading</span>
          <span class="logo-tagline">{{ langSvc.t().logoTagline }}</span>
        </div>
      </a>

      <!-- Primary nav (desktop) -->
      <nav class="primary-nav" aria-label="Primary navigation">
        <a class="nav-link" [routerLink]="['/products']" routerLinkActive="nav-link--active">
          {{ langSvc.t().navProducts }}
        </a>
        <a class="nav-link" [routerLink]="['/brands']" routerLinkActive="nav-link--active">
          {{ langSvc.t().navBrands }}
        </a>
        <a class="nav-link" [routerLink]="['/showroom']" routerLinkActive="nav-link--active">
          {{ langSvc.t().navShowroom }}
        </a>
        <a class="nav-link nav-link--cta"
           href="https://wa.me/96170000000"
           target="_blank"
           rel="noopener noreferrer">
          {{ langSvc.t().navInquire }}
        </a>
      </nav>

      <!-- Controls -->
      <div class="header-controls">

        <!-- Language toggle -->
        <button class="ctrl-btn"
                (click)="langSvc.toggle()"
                [attr.aria-label]="'Toggle language'">
          <svg class="ctrl-icon" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round"
               aria-hidden="true">
            <circle cx="12" cy="12" r="10"/>
            <line x1="2" y1="12" x2="22" y2="12"/>
            <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
          </svg>
          <span>{{ langSvc.t().langLabel }}</span>
        </button>

        <!-- Theme toggle -->
        <button class="ctrl-btn"
                (click)="themeSvc.toggle()"
                aria-label="Toggle colour mode">
          @if (themeSvc.theme() === 'light') {
            <svg class="ctrl-icon" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round"
                 aria-hidden="true">
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
            </svg>
          }
          @if (themeSvc.theme() === 'dark') {
            <svg class="ctrl-icon" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round"
                 aria-hidden="true">
              <circle cx="12" cy="12" r="5"/>
              <line x1="12" y1="1" x2="12" y2="3"/>
              <line x1="12" y1="21" x2="12" y2="23"/>
              <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
              <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
              <line x1="1" y1="12" x2="3" y2="12"/>
              <line x1="21" y1="12" x2="23" y2="12"/>
              <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
              <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
            </svg>
          }
        </button>

      </div>
    </div>
  </div>
</header>
