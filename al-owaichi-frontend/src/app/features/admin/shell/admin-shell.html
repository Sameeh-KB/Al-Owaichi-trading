<div class="admin-layout" [class.collapsed]="!sideOpen()">

  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <img class="logo-img" src="/logo-mark.png" alt="Al Owaichi" />
      <span class="brand-name">AOT Admin</span>
      <button class="toggle-btn" (click)="toggle()" title="Toggle sidebar">
        {{ sideOpen() ? '◀' : '▶' }}
      </button>
    </div>

    <nav class="sidebar-nav">
      <a routerLink="/admin/dashboard"  routerLinkActive="active" class="nav-item">
        <span class="icon">📊</span><span class="label">Dashboard</span>
      </a>
      <a routerLink="/admin/bikes"      routerLinkActive="active" class="nav-item">
        <span class="icon">🏍</span><span class="label">Bikes</span>
      </a>
      <a routerLink="/admin/inquiries"  routerLinkActive="active" class="nav-item">
        <span class="icon">📬</span><span class="label">Inquiries</span>
      </a>
      <a routerLink="/admin/uploads"    routerLinkActive="active" class="nav-item">
        <span class="icon">🖼</span><span class="label">Media</span>
      </a>
    </nav>

    <div class="sidebar-footer">
      @if (auth.user$ | async; as user) {
        <div class="user-info">
          <span class="avatar">{{ user.name[0] }}</span>
          <span class="user-name">{{ user.name }}</span>
        </div>
      }
      <button class="logout-btn" (click)="logout()">
        <span class="icon">🚪</span><span class="label">Logout</span>
      </button>
    </div>
  </aside>

  <!-- Main content -->
  <main class="main-content">
    <router-outlet />
  </main>

</div>
