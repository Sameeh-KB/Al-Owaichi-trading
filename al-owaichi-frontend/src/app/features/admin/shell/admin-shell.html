<div class="admin-layout" [class.collapsed]="!sideOpen()">

  <!-- Sidebar -->
  <aside class="sidebar">
    <!-- Logo / brand -->
    <div class="sidebar-brand">
      <img class="brand-logo" src="/logo-mark.png" alt="Al Owaichi" />
      <div class="brand-text">
        <span class="brand-name">Al Owaichi</span>
        <span class="brand-role">Admin Panel</span>
      </div>
      <button class="collapse-btn" (click)="toggle()" [title]="sideOpen() ? 'Collapse' : 'Expand'">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round">
          @if (sideOpen()) {
            <polyline points="15 18 9 12 15 6"/>
          } @else {
            <polyline points="9 18 15 12 9 6"/>
          }
        </svg>
      </button>
    </div>

    <!-- Nav -->
    <nav class="sidebar-nav">
      <p class="nav-section-label">MAIN</p>

      <a routerLink="/admin/dashboard" routerLinkActive="active" class="nav-item">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="7" height="7"/>
          <rect x="14" y="3" width="7" height="7"/>
          <rect x="14" y="14" width="7" height="7"/>
          <rect x="3" y="14" width="7" height="7"/>
        </svg>
        <span class="nav-label">Dashboard</span>
      </a>

      <a routerLink="/admin/bikes" routerLinkActive="active" class="nav-item">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="5.5" cy="17.5" r="2.5"/>
          <circle cx="18.5" cy="17.5" r="2.5"/>
          <path d="M8 17.5h7"/>
          <path d="M5.5 17.5 9 10l4 2 2-6h3"/>
          <path d="m18.5 17.5-1-6-3 1"/>
        </svg>
        <span class="nav-label">Bikes</span>
      </a>

      <a routerLink="/admin/inquiries" routerLinkActive="active" class="nav-item">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
        </svg>
        <span class="nav-label">Inquiries</span>
      </a>

      <a routerLink="/admin/uploads" routerLinkActive="active" class="nav-item">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="18" height="18" rx="2"/>
          <circle cx="8.5" cy="8.5" r="1.5"/>
          <polyline points="21 15 16 10 5 21"/>
        </svg>
        <span class="nav-label">Media</span>
      </a>
    </nav>

    <!-- User / logout -->
    <div class="sidebar-footer">
      @if (auth.user$ | async; as user) {
        <div class="user-row">
          <div class="user-avatar">{{ user.name[0].toUpperCase() }}</div>
          <div class="user-info">
            <span class="user-name">{{ user.name }}</span>
            <span class="user-role">Administrator</span>
          </div>
        </div>
      }
      <button class="logout-btn" (click)="logout()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
          <polyline points="16 17 21 12 16 7"/>
          <line x1="21" y1="12" x2="9" y2="12"/>
        </svg>
        <span class="logout-label">Sign out</span>
      </button>
    </div>
  </aside>

  <!-- Main content -->
  <main class="main-content">
    <router-outlet />
  </main>

</div>
