<!doctype html>
<html lang="en" dir="ltr" data-theme="light">
<head>
  <meta charset="utf-8">
  <title>Al Owaichi Trading — Motorcycle Catalog</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Al Owaichi Trading — Official Haojue, Zontes and Linhai motorcycle dealer in Lebanon.">
  <link rel="icon" type="image/x-icon" href="favicon.ico">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Cairo:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- No-FOUC: apply saved theme before Angular boots -->
  <script>
    (function () {
      var saved = localStorage.getItem('aot-theme');
      var pref  = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', saved || pref);
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
